name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            exit 1
          fi
